name: Release

# One tag does everything: builds from the committed source, publishes to npm
# with a provenance attestation, and opens the matching GitHub release.
#
# Setup, once:
#   npm token (Automation type) -> repo Settings > Secrets and variables >
#   Actions > New repository secret, named NPM_TOKEN
#
# Then, for every release:
#   npm version patch | minor | major
#   git push --follow-tags

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release
      id-token: write # to attach npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      # prepublishOnly runs typecheck, tests and build, so a broken commit
      # cannot become a published version.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Runs only if the publish above succeeded, so the GitHub release never
      # advertises a version that is not actually installable.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag