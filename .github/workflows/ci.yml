name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install library dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      # Catches the mistake that is invisible until someone installs the
      # package: source, tests or the example app leaking into the tarball,
      # or dist/ missing from it entirely.
      - name: Inspect the tarball that would be published
        run: npm pack --dry-run

      - name: Install example dependencies
        run: npm ci || npm install
        working-directory: example

      - name: Build example
        run: npm run build
        working-directory: example